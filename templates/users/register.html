{% extends "base.html" %}

{% block title %}
    Регистрация
{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="card-title text-center mb-4">
                        Регистрация
                    </h2>

                    {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="post" action="/users/register" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Логин
                            </label>

                            <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">
                                Имя
                            </label>

                            <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                email
                            </label>

                            <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">
                                Пароль
                            </label>

                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="mb-4">
                            <label for="image" class="form-label">
                                Изображение профиля
                            </label>
        
                            <input type="file" id="image" name="image" class="form-control" accept="image/jpeg,image/png">
        
                            <div class="form-text">
                                Изображение необязательно.
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Зарегистрироваться
                        </button>

                    </form>

                    <p class="text-center text-muted mt-4 mb-0">
                        Уже есть аккаунт?
                        <a href="/users/login">
                            Войти
                        </a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
